context:
  name: jupyter_server_documents
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ae6961e5ab43ce1f32076957a40fbf16585537614a97ef4131394218017702cd

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
    - hatch-jupyter-builder >=0.5
    - pip
  run:
    - python >=3.9
    - jupyter-collaboration-ui >=2.4.0,<4
    - jupyter-docprovider >=2.4.0,<4
    - jupyter_server >=2.4.0,<3
    - jupyter_server_fileid >=0.9.0,<0.10.0
    - pycrdt >=0.12.49
    - jupyter_ydoc >=3.0.0,<5.0.0

tests:
  - python:
      imports:
        - jupyter_server_documents
      # Also run `pip check` to verify the integrity
      pip_check: true

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-server-documents
  repository: https://github.com/jupyter-ai-contrib/jupyter-server-documents
  summary: A JupyterLab extension that provides RTC capabilities.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - andrii-i
    - jtpio
    - dlqqq
    - 3coins
    - Zsailer
